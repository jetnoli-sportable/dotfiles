# Run or Raise app keys: Super+letter focuses the app (cycling its windows on
# repeat, switching workspace if it lives elsewhere) or starts it.
# Format: shortcut,command,wm_class,title. The command is the app's .desktop
# name; wm_class is its StartupWMClass (Looking Glass, Alt+F2 lg, if absent).
# Reload after editing:
#   gnome-extensions disable run-or-raise@edvard.cz && gnome-extensions enable run-or-raise@edvard.cz
# Every key here must be free in GNOME and Forge: gnome/check-keys.sh checks.

<Super>i,com.mitchellh.ghostty.desktop,com.mitchellh.ghostty,
