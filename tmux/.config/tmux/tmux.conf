# Add binding to reload tmux.conf for fast, iterative development
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# wb (workbench): the unified session/agent/task picker, replacing the
# session.sh (m) + claude-sessions.sh (a) split — cutover per
# logs/decisions/2026-07-06-review-outstanding.md item 9. `s`/`ca` stay
# invocable by name (zsh aliases) as a fallback.
bind m new-window "~/.config/scripts/tmux/wb.sh"
bind a new-window "~/.config/scripts/tmux/wb.sh"
# Claude agent push-notification:
#   prefix+j -> jump straight to the most-urgent waiting agent
#   prefix+J -> preview it first (j/Enter jumps, any other key closes)
bind j run-shell "~/.config/scripts/tmux/claude-sessions.sh goto"
bind J display-popup -w 80% -h 60% -T ' claude · most-urgent agent ' -E "~/.config/scripts/tmux/claude-sessions.sh preview-popup"
bind n next-window
bind N new-window "~/.config/scripts/tmux/notes.sh"
bind M new-window "~/.config/scripts/tmux/notes.sh ."
# Personal-workflow docs hub (dotfiles/docs/HUB.html) -- `h`/`H` carry no
# tmux default (unlike `o`/`O`, which cycle pane focus / rotate windows), so
# they're free without shadowing anything.
bind h run-shell -b "xdg-open ~/code/dotfiles/docs/HUB.html"
# prefix+? — the help picker: fzf over docs/INDEX.md (every bind, alias,
# skill, doc, decision with provenance). Enter = take me to it; preview =
# about it. Shadows tmux's default `?` (list-keys) deliberately — the INDEX
# carries these binds too, with better context. Q&A twin: /help in Claude.
bind ? new-window "~/.config/scripts/tmux/help.sh"
# prefix+q — quick-ask: a scratch Claude Code window for a one-off question,
# separate from `/help` (zero-LLM index lookup) and from `wb`'s persistent
# task-scoped agent windows (roadmap 9f-5). `A` was the original pick but
# was already bound to lazydocker below; tmux's default `q` (display-panes)
# is low-value and unused elsewhere in this config, so it's free.
bind q new-window "~/.config/scripts/tmux/ask.sh"
bind-key g new-window -c "#{pane_current_path}" -n "lazygit" "$SHELL -lc 'lazygit'"
bind-key A new-window -c "#{pane_current_path}" -n "lazydocker" "$SHELL -lc 'lazydocker'"
# Edit the Metrics Server config.hjson (Env / Region / SportType …)
bind-key C new-window -n "msconfig" "nvim ~/code/be--monorepo/apps/metrics_server/config.hjson"

# Set Prefix
unbind C-b
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Set Page Index to 1
set -g base-index 1
setw -g pane-base-index 1
setw -g pane-base-index 1

# Land in another session instead of ejecting to the shell when the
# attached session is destroyed (kill-session, wb done --close, last pane
# exiting). "off" switches to the most-recently-active remaining session;
# "no-detached" was considered but can still eject you if every other
# session already has a client attached elsewhere.
set -g detach-on-destroy off

# Agent windows/panes (wb_layout_session's `agent` window, `handoff --pane`)
# run claude inside a bare shell and set remain-on-exit, so a stray Ctrl-D /
# `exit` after quitting claude leaves the window as [dead] rather than silently
# closing it (the "why do my windows keep getting killed" fix). prefix+E
# respawns a dead pane in place so you can relaunch claude without rebuilding
# the whole session. -k also lets it recycle a still-live pane. Shadows tmux's
# default `E` (spread-panes evenly), which is unused in this workflow.
bind E respawn-pane -k -c "#{pane_current_path}"

# Theming
# clock mode
setw -g clock-mode-colour blue

# statusbar
set -g status-position bottom
set -g status-justify left

set -g status-interval 5
# NOTE: status-left itself is set at the BOTTOM of this file, after the tpm run —
# the catppuccin plugin overwrites status-left on load, so setting it here is futile.

set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-format ' #I #W #F '

set -g mouse on

# Enable system‐clipboard integration (tmux ≥ 2.6)
set -g set-clipboard on # :contentReference[oaicite:8]{index=8}
# Clipboard: switched from xclip to wl-copy (wl-clipboard package) because the session
# runs under Wayland (XDG_SESSION_TYPE=wayland). xclip is X11-only and silently drops
# copies, breaking paste in the browser and other Wayland apps.
# Install: sudo apt install wl-clipboard
# Original xclip implementation:
#   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
#   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"


# (For tmux < 2.6 use “external” instead of “on”)
# set -s set-clipboard external       # :contentReference[oaicite:9]{index=9}

# allow-passthrough enables DCS-wrapped passthrough sequences (used by
# things like terminal image protocols) -- it is NOT what makes raw OSC52
# clipboard writes work; that's set-clipboard above (corrected 2026-07-08,
# roadmap 9f-4: the original comment here conflated the two). Kept on since
# some tools do use DCS passthrough, but don't expect it to fix an OSC52
# clipboard issue on its own.
set -g allow-passthrough on            # :contentReference[oaicite:10]{index=10}
set -g focus-events on            # so vim knows when to pull tmux’s buffer :contentReference[oaicite:6]{index=6}

# Acknowledge-on-arrival: focusing a pane clears its @claude_blocked marker, so the
# status-left count self-extinguishes the moment you reach the agent (decision: focus
# = acknowledged). Cheap no-op for panes that never had the marker.
set-hook -g pane-focus-in 'set -pu @claude_blocked'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"     # truecolor for Ghostty's TERM
# colored/undercurl underlines passthrough (nvim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d m'

# # BINDINGS
# # — Window: leader + j/k/l/; → windows 1–4
# bind j select-window -t 1           # leader+j → window 1 :contentreference[oaicite:3]{index=3}
# bind k select-window -t 2           # leader+k → window 2 :contentreference[oaicite:4]{index=4}
# bind l select-window -t 3           # leader+l → window 3 :contentreference[oaicite:5]{index=5}
#
# Neovim Configuration

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# TODO: LOOK at PLUGIN Version
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# bind-key -T copy-mode-vi 'C-\' select-pane -l


# All tpm state lives under the XDG tree (plugins install here; tpm itself is
# cloned here too — see install.sh). The legacy ~/.tmux/ location is retired.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# THEMES
set -g @catppuccin_flavour 'mocha'


# set vi-mode
set-window-option -g mode-keys vi

# Open pane in current dir
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

# Claude agent notification segment — MUST come after tpm: the catppuccin plugin
# (loaded by tpm above) overwrites status-left, so we set ours last to win.
# Quiet count of agents needing you: ✳N needs-input (magenta) · ✔N finished (cyan).
# Blank when nothing waits. Reads @claude_blocked markers (claude-notify-hook.sh).
set -g status-left '#(~/.config/scripts/tmux/claude-status.sh)'
set -g status-left-length 25
