<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#1A2224; --muted:#56625F; --rule:#D3DAD7;
  --accent:#1F6F6A; --accent-soft:#D8ECEA; --amber:#9A5B0B; --amber-soft:#F6E7CF;
  --ok:#2C7A47; --ok-soft:#DCEFE2; --bad:#A8322A; --bad-soft:#F6DEDB; --new:#3B55B8; --new-soft:#E0E6F8;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111617; --surface:#182022; --sunk:#1F292B; --ink:#E3EAE8; --muted:#9AA8A5; --rule:#2C3739;
  --accent:#5CC2B9; --accent-soft:#16312F; --amber:#E4AA55; --amber-soft:#35280F;
  --ok:#6DC98C; --ok-soft:#15301F; --bad:#EE8A80; --bad-soft:#3A1B18; --new:#93A8F2; --new-soft:#1C2444;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#111617; --surface:#182022; --sunk:#1F292B; --ink:#E3EAE8; --muted:#9AA8A5; --rule:#2C3739;
  --accent:#5CC2B9; --accent-soft:#16312F; --amber:#E4AA55; --amber-soft:#35280F;
  --ok:#6DC98C; --ok-soft:#15301F; --bad:#EE8A80; --bad-soft:#3A1B18; --new:#93A8F2; --new-soft:#1C2444;
  color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);margin:0;padding-inline:16px;padding-block:0 64px}
.shell{width:min(85vw,1480px);margin-inline:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
@media (max-width:900px){.shell{width:100%;grid-template-columns:1fr;gap:0}}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-top:40px;max-height:100vh;overflow-y:auto}
nav.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;border-left:1px solid var(--rule)}
nav.rail a{display:block;padding:5px 12px;color:var(--muted);text-decoration:none;font-size:13.5px;border-left:2px solid transparent;margin-left:-1px}
nav.rail a:hover,nav.rail a:focus-visible{color:var(--ink);border-left-color:var(--accent);outline:none}
nav.rail .prog{padding:10px 12px;font:600 13px var(--cond);color:var(--accent)}
@media (max-width:900px){
  nav.rail{z-index:5;background:var(--ground);padding:10px 0;max-height:none;border-bottom:1px solid var(--rule)}
  nav.rail ol{display:flex;gap:4px;overflow-x:auto;border:0;white-space:nowrap}
  nav.rail a{border:1px solid var(--rule);border-radius:4px;margin:0;padding:4px 10px}
}
main{min-width:0;padding-top:40px}
.eyebrow{font:600 11.5px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(28px,3.4vw,40px)/1.12 var(--cond);margin:10px 0 14px}
h2{font:600 24px/1.2 var(--cond);margin:0 0 6px}
section{padding-block:32px;border-top:1px solid var(--rule);scroll-margin-top:60px}
section:first-of-type{border-top:0;padding-top:0}
p{margin:0 0 12px;max-width:80ch}
.sub{color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--sunk);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--sunk);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;margin:6px 0;overflow-x:auto;font:13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:13px;margin-bottom:16px}
.meta b{color:var(--ink);font-weight:500}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:420px;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
button{font:500 13px var(--sans);border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin-bottom:10px}
.item.done{background:var(--ok-soft)}
.item input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.item h3{font:600 16px/1.35 var(--cond);margin:0 0 4px}
.item .exp{color:var(--muted);font-size:14px;margin:4px 0 0}
.item .exp b{color:var(--ink);font-weight:500}
.item:has(input:checked) h3{color:var(--muted)}
.pill{display:inline-block;font:600 10.5px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:middle}
.pill.def{background:var(--amber-soft);color:var(--amber)}
table{border-collapse:collapse;width:100%;margin:10px 0 18px;font-size:14px;background:var(--surface)}
.tw{overflow-x:auto}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--sunk);font:600 13px var(--cond)}
blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 5px 5px 0}
blockquote p{margin:0}
ul,ol{max-width:84ch;padding-left:22px}
li{margin:4px 0}
main h1+p{font-size:16px}
h3{font:600 17px/1.3 var(--cond);margin:22px 0 6px}
figure{margin:18px 0 22px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 16px 10px;overflow-x:auto}
figure svg{display:block;width:100%;height:auto;min-width:640px;color:var(--ink)}
figcaption{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:90ch}
svg text{fill:currentColor;font-family:var(--sans);font-size:12px}
svg .t-b{font:600 13px var(--cond)}
svg .t-s{fill:var(--muted);font-size:11px}
svg .t-m{fill:var(--muted);font:11px var(--mono)}
svg .ln{stroke:var(--muted);stroke-width:1.4;fill:none}
svg .k-script{fill:var(--sunk);stroke:var(--muted)}
svg .k-orch{fill:var(--accent-soft);stroke:var(--accent)}
svg .k-sub{fill:var(--new-soft);stroke:var(--new)}
svg .k-ver{fill:var(--amber-soft);stroke:var(--amber)}
svg .b-logic{fill:var(--bad)} svg .b-skill{fill:var(--amber)} svg .b-test{fill:var(--new)} svg .b-doc{fill:var(--rule)} svg .b-gen{fill:var(--sunk);stroke:var(--muted);stroke-dasharray:3 2}
svg .arrowhead{fill:var(--muted)}
</style>
