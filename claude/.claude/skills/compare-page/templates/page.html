<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f4f6f4;
  --surface: #ffffff;
  --sunk: #e9edea;
  --ink: #18221f;
  --muted: #56645f;
  --rule: #d3dbd7;
  --accent: #2c5d8a;
  --accent-soft: #dfe9f3;
  --ok: #2f7a4d;
  --ok-soft: #dcefe3;
  --wait: #9a6412;
  --wait-soft: #f6ead3;
  --bad: #ab3c35;
  --bad-soft: #f5e0de;
  --code-bg: #eef1ef;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121816; --surface: #19211e; --sunk: #1f2926; --ink: #e3ebe7; --muted: #9aaba4;
    --rule: #2f3b37; --accent: #7fb0de; --accent-soft: #1d2e3f; --ok: #74c793; --ok-soft: #173024;
    --wait: #e0ad5c; --wait-soft: #33291a; --bad: #ec8b83; --bad-soft: #3a1f1d; --code-bg: #1d2623;
  }
}
:root[data-theme="dark"] {
  --ground: #121816; --surface: #19211e; --sunk: #1f2926; --ink: #e3ebe7; --muted: #9aaba4;
  --rule: #2f3b37; --accent: #7fb0de; --accent-soft: #1d2e3f; --ok: #74c793; --ok-soft: #173024;
  --wait: #e0ad5c; --wait-soft: #33291a; --bad: #ec8b83; --bad-soft: #3a1f1d; --code-bg: #1d2623;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; padding-block: 40px 80px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 13px; }
nav.toc p { margin: 0 0 8px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
nav.toc a { color: var(--muted); text-decoration: none; display: block; padding: 3px 0 3px 10px; border-left: 2px solid var(--rule); }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); border-left-color: var(--accent); }
main { min-width: 0; max-width: 780px; }
@media (max-width: 860px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 24px 64px; }
  nav.toc { position: static; }
  nav.toc ol { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 26px; font-weight: 700; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); }
h4 { font-size: 15px; font-weight: 600; }
p, ul, ol { margin: 12px 0 0; }
li + li { margin-top: 4px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; margin: 0 0 12px; }
.lede { font-size: 19px; line-height: 1.55; margin-top: 16px; max-width: 64ch; }
.meta { color: var(--muted); font-size: 14px; margin-top: 14px; }

.badge { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); vertical-align: middle; white-space: nowrap; }
.badge.rec { background: var(--accent-soft); color: var(--accent); }
h2 .badge { margin-left: 8px; font-family: var(--mono); }

.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 24px; }
.glance a { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.glance a.rec { border: 2px solid var(--accent); }
.glance a:hover, .glance a:focus-visible { border-color: var(--accent); }
.glance b { display: block; font-family: var(--display); font-size: 15px; margin: 6px 0 2px; }
.glance span.s { color: var(--muted); }

.dg-wrap { overflow-x: auto; margin-top: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; }
.dg { display: block; min-width: 640px; width: 100%; height: auto; }
.dg text { fill: var(--ink); font-family: var(--body); font-size: 13px; }
.dg text.t { font-weight: 600; }
.dg text.s { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.dg text.z { fill: var(--muted); font-size: 11px; letter-spacing: .06em; font-weight: 600; }
.dg .zone { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 5 4; }
.dg .zone.accent { fill: var(--accent-soft); stroke: var(--accent); }
.dg .box { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.dg .box.key { stroke: var(--accent); stroke-width: 2.2; }
.dg .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.dg .edge.dash { stroke-dasharray: 5 4; }
.dg .head { fill: var(--muted); }
.dg .num circle { fill: var(--accent); }
.dg .num text { fill: var(--surface); font-size: 11px; font-weight: 700; text-anchor: middle; }
ol.legend { margin-top: 12px; font-size: 15px; }

.pc { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
.pc > div { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; font-size: 15px; }
.pc > div.pro { border-top: 3px solid var(--ok); }
.pc > div.con { border-top: 3px solid var(--bad); }
.pc ul { padding-left: 18px; margin-top: 6px; }
.wins { margin-top: 12px; border-left: 3px solid var(--wait); background: var(--surface); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 15px; }

.tbl { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface); border: 1px solid var(--rule); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunk); }
thead th.rec { color: var(--accent); }
td.rec { background: var(--accent-soft); }
tbody th { font-weight: 500; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: none; }
.verdict { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 18px; margin-top: 16px; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
<!--BODY-->
</div>
</body>
</html>
