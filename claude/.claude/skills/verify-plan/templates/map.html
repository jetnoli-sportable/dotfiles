<!doctype html>
<!--
---
__VP_META__
---
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>__VP_TITLE__</title>
    <style>
      __VP_CSS__
/* map page only */
.top {
        display: flex;
        gap: 12px 24px;
        flex-wrap: wrap;
        align-items: center;
        margin: 0 0 12px;
      }
      .seg {
        display: inline-flex;
        background: var(--code);
        border-radius: 8px;
        padding: 3px;
      }
      .seg[hidden] {
        display: none;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 6px 16px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        border-radius: 6px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--acc);
        color: #fff;
      }
      .seg button:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .band .n.b {
        color: var(--bad);
      }
      /* status dots and key */
      .dot {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid var(--mut);
        flex: none;
        box-sizing: border-box;
      }
      .dot.built,
      .dot.passed {
        background: var(--ok);
        border-color: var(--ok);
      }
      .dot.planned,
      .dot.skipped,
      .dot.not-run {
        border-color: var(--plan);
        border-style: dashed;
      }
      .dot.proposed {
        border-style: dashed;
      }
      .dot.gap {
        border-color: var(--bad);
        opacity: 0.55;
      }
      .dot.failed {
        background: var(--bad);
        border-color: var(--bad);
      }
      .dot.you {
        background: var(--eyesb);
        border-color: var(--eyesb);
      }
      .legend .d {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      /* grid: gap cells, tiles, panel row */
      .grid td.gap {
        background: var(--badbg);
        outline: 2px dashed var(--bad);
        outline-offset: -2px;
        padding: 0;
        vertical-align: middle;
      }
      .grid td.gap.acc {
        background: none;
        outline-color: var(--plan);
      }
      .gb {
        display: block;
        width: 100%;
        padding: 16px 8px;
        background: none;
        border: 0;
        color: var(--bad);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }
      .grid td.gap.acc .gb {
        color: var(--plan);
      }
      .gb:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: -4px;
      }
      .tl.mt {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        border: 0;
        background: none;
        padding: 4px 4px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
      }
      .tl.mt::before {
        content: "";
        flex: none;
        width: 11px;
        height: 11px;
        margin-top: 3px;
        border-radius: 50%;
        border: 2px solid var(--mut);
        box-sizing: border-box;
      }
      .tl.mt.built::before,
      .tl.mt.passed::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .tl.mt.planned::before,
      .tl.mt.skipped::before,
      .tl.mt.not-run::before {
        border: 2px dashed var(--plan);
      }
      .tl.mt.proposed::before {
        border: 2px dashed var(--mut);
      }
      .tl.mt.wk.you::before {
        background: var(--eyesb);
        border-color: var(--eyesb);
      }
      .tl.mt.failed::before {
        background: var(--bad);
        border-color: var(--bad);
      }
      .tl.mt.wait {
        outline: 2px dashed var(--plan);
        outline-offset: -2px;
        background: var(--planbg);
      }
      button.tl.mt:hover {
        background: var(--code);
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* section nav under the summary band */
      nav.secs {
        position: sticky;
        top: var(--stagesh, 52px);
        z-index: 4;
        background: var(--bg);
        display: flex;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        margin-top: 14px;
        font-size: 14px;
        flex-wrap: wrap;
      }
      nav.secs a {
        color: var(--mut);
        text-decoration: none;
        font-weight: 600;
        padding: 2px 0;
        border-bottom: 2px solid transparent;
      }
      nav.secs a:hover,
      nav.secs a.on {
        color: var(--acc);
        border-bottom-color: var(--acc);
      }
      nav.secs a:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 3px;
        border-radius: 3px;
      }
      h2 {
        scroll-margin-top: 120px;
      }
      .grid td.gap.wait {
        background: none;
        outline-color: var(--plan);
      }
      .grid td.gap.wait .gb {
        color: var(--plan);
      }
      #grid .ov td.o-gap.o-wait {
        background: none;
        color: var(--plan);
        outline-color: var(--plan);
      }
      .nchk {
        background: var(--badbg);
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 16px;
        font-size: 14px;
      }
      .nchk h3,
      .pbox h3 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .nchk ul,
      .pbox ul {
        margin: 0;
        padding-left: 20px;
      }
      .pbox {
        background: var(--card);
        border: 2px dashed var(--plan);
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 28px;
        font-size: 14px;
      }
      .rq .chip {
        display: inline-block;
        margin-left: 6px;
        font-size: 11px;
        font-weight: 700;
        padding: 0 7px;
        border-radius: 99px;
        background: var(--eyes);
        color: var(--eyesb);
        white-space: nowrap;
      }
      .rq .chip.acc {
        background: var(--planbg);
        color: var(--plan);
      }
      .grid td.dtd {
        padding: 0;
        background: none;
      }
      .panel {
        grid-column: 1 / -1;
        background: var(--card);
        border-left: 4px solid var(--acc);
        border-radius: 10px;
        padding: 14px 18px;
        margin: 6px 0;
        scroll-margin-top: 90px;
      }
      .bh {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bh h3 {
        flex: 1;
        margin: 0;
        font-size: 17px;
      }
      .x {
        border: 0;
        background: var(--code);
        border-radius: 6px;
        width: 30px;
        aspect-ratio: 1;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        flex: none;
      }
      .x:hover {
        background: var(--acc);
        color: #fff;
      }
      .x:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .secs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 0 28px;
      }
      .sec {
        margin: 12px 0 0;
        font-size: 14px;
      }
      .ctl {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        margin: 0 0 12px;
      }
      /* overview density: slim rows, worst status per cell */
      #grid:not(.ovm) tr.ov,
      #grid:not(.ovm) tfoot {
        display: none;
      }
      #grid.ovm tbody tr.dr,
      #grid.ovm tbody tr.dtr {
        display: none;
      }
      #grid.ovm {
        border-spacing: 8px 5px;
      }
      #grid.ovm thead th {
        padding-bottom: 14px;
      }
      #grid .ov td {
        padding: 0 8px;
        height: 34px;
        font-size: 13px;
        line-height: 34px;
        overflow: hidden;
      }
      #grid .ov td.rq {
        padding: 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: none;
      }
      .ovb {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--acc);
        text-align: left;
      }
      .ovb b {
        font-weight: 800;
      }
      .ovb:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
        border-radius: 3px;
      }
      #grid .ov td.o-gap {
        background: var(--badbg);
        color: var(--bad);
        font-weight: 700;
        outline: 1px dashed var(--bad);
        outline-offset: -1px;
      }
      #grid .ov td.o-gap.o-acc {
        background: none;
        color: var(--plan);
        outline-color: var(--plan);
      }
      #grid .ov td.o-planned,
      #grid .ov td.o-proposed,
      #grid .ov td.o-skipped,
      #grid .ov td.o-not-run {
        background: var(--planbg);
      }
      #grid .ov td.o-failed {
        background: var(--badbg);
      }
      .ol {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .ol .on {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .oc {
        flex: none;
        font-size: 11px;
        font-weight: 700;
        line-height: 16px;
        color: var(--mut);
        background: var(--code);
        border-radius: 8px;
        padding: 0 6px;
      }
      .ov {
        cursor: pointer;
      }
      .ov:hover td {
        box-shadow: inset 0 0 0 2px var(--acc);
      }
      tfoot td {
        font-size: 13px;
        font-weight: 700;
        background: none !important;
        padding: 6px 8px !important;
      }
      .grid tr.flash td {
        box-shadow: inset 0 0 0 3px var(--plan);
      }
      .view {
        display: none;
      }
      .view.on {
        display: block;
      }
      /* by system part */
      .sysv {
        background: var(--card);
        border-radius: 10px;
        padding: 18px;
      }
      .sysv .prime {
        max-width: 110ch;
        margin: 0 0 12px;
      }
      .key {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        font-size: 13px;
        margin: 0 0 14px;
        padding: 10px 12px;
        background: var(--code);
        border-radius: 6px;
      }
      .key span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .key i {
        display: inline-block;
        width: 26px;
        height: 14px;
        border-radius: 3px;
      }
      .sysg {
        display: grid;
        grid-template-columns: minmax(200px, 1.3fr) repeat(
            var(--n),
            minmax(0, 1fr)
          );
        gap: 6px;
        align-items: stretch;
      }
      .sp {
        background: var(--code);
        border: 1.4px solid var(--ink);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        min-width: 0;
      }
      .sp b {
        display: block;
        font-size: 14px;
      }
      .sp small {
        display: block;
        color: var(--mut);
        font-size: 12px;
        line-height: 1.35;
      }
      .sp.unreached {
        border-color: var(--bad);
        background: var(--badbg);
      }
      .sp em {
        display: block;
        font-style: normal;
        font-weight: 700;
        font-size: 12px;
        color: var(--bad);
        margin-top: 4px;
      }
      .stn {
        text-align: left;
        background: none;
        border: 2px solid transparent;
        border-radius: 6px;
        padding: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        align-self: center;
      }
      .stn:hover,
      .stn:focus-visible {
        background: var(--code);
        outline: 0;
        border-color: var(--acc);
      }
      .stn i {
        display: block;
        font-style: normal;
        font-weight: 400;
        font-size: 12px;
        color: var(--mut);
      }
      .stn.you {
        cursor: default;
        color: var(--eyesb);
      }
      .sc {
        border-radius: 5px;
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--mut);
      }
      .sc.real {
        background: var(--okbg);
        border: 1.6px solid var(--ok);
        color: var(--ok);
        font-weight: 700;
      }
      .sc.fake {
        background: repeating-linear-gradient(
          45deg,
          var(--mut) 0 1px,
          transparent 1px 6px
        );
        border: 1.4px dashed var(--mut);
      }
      .sc.skip {
        border: 1.2px dotted var(--line);
      }
      .sc.you {
        background: var(--eyes);
        border: 1.8px solid var(--eyesb);
        color: var(--eyesb);
        font-weight: 700;
      }
      .sunr {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        background: var(--okbg);
      }
      .sunr.bad {
        background: var(--badbg);
        color: var(--bad);
        font-weight: 600;
      }
      /* walkthrough */
      .sum {
        display: flex;
        gap: 6px 14px;
        align-items: center;
        flex-wrap: wrap;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 12px;
        background: var(--okbg);
        border: 2px solid var(--loc);
        font-weight: 600;
      }
      .sum.loud {
        background: var(--cldbg);
        border-color: var(--cld);
      }
      .sum .big {
        font-size: 16px;
      }
      .wlist {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .step {
        background: var(--card);
        border-left: 6px solid var(--loc);
        border-radius: 8px;
        scroll-margin-top: 70px;
      }
      .step.cloud {
        border: 1px solid var(--cld);
        border-left: 6px solid var(--cld);
        background: var(--cldbg);
      }
      .step .hd {
        padding: 8px 12px 2px;
      }
      .tg {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
        padding: 4px 0;
      }
      .tg:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .tg .sid {
        font-weight: 800;
        color: var(--acc);
        min-width: 28px;
      }
      .tg .ttl {
        font-weight: 600;
        flex: 1 1 260px;
      }
      .tg .chev {
        margin-left: auto;
        font-size: 13px;
        transition: transform 0.15s;
        color: var(--acc);
        font-weight: 700;
      }
      .step.open .tg .chev {
        transform: rotate(180deg);
      }
      .step .tags {
        padding: 0 12px 8px 50px;
        display: flex;
        gap: 6px 14px;
        flex-wrap: wrap;
      }
      .acc {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.05em;
        padding: 2px 9px;
        border-radius: 5px;
        color: #fff;
        white-space: nowrap;
        margin-right: 4px;
        display: inline-block;
      }
      .acc.LOCAL {
        background: var(--okbg);
        color: var(--loc);
        border: 1px solid var(--loc);
      }
      .acc.CLOUD {
        background: var(--cld);
      }
      .acc.CHANGES {
        background: var(--chg);
      }
      .acc.PROD {
        background: var(--prod);
      }
      .acc.PERM {
        background: var(--perm);
      }
      .runst {
        font-size: 13px;
        font-weight: 700;
        border-radius: 99px;
        padding: 1px 10px;
        background: var(--code);
      }
      .runst.passed {
        background: var(--okbg);
        color: var(--ok);
      }
      .runst.failed {
        background: var(--badbg);
        color: var(--bad);
      }
      .runst.skipped,
      .runst.not-run {
        background: var(--planbg);
        color: var(--plan);
      }
      .bd {
        display: none;
        padding: 2px 16px 14px 50px;
      }
      .step.open .bd {
        display: block;
      }
      .f {
        margin: 10px 0;
        font-size: 15px;
      }
      .f .k {
        font-size: 13px;
        letter-spacing: 0.07em;
      }
      .f.ex .k {
        color: var(--ok);
      }
      .f.wr .k {
        color: var(--bad);
      }
      .risk {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: 6px;
        border: 2px solid var(--loc);
        background: var(--okbg);
      }
      .risk .k {
        color: var(--loc);
        font-weight: 800;
      }
      .step.cloud .risk {
        border-color: var(--cld);
        background: var(--card);
      }
      .step.cloud .risk .k {
        color: var(--cld);
      }
      .cmd {
        background: var(--code);
        border-radius: 6px;
        padding: 9px 12px;
        margin: 4px 0;
      }
      .cmd .copy {
        display: flex;
        width: 100%;
        align-items: flex-start;
        justify-content: space-between;
      }
      .cmd .hint {
        flex: 1;
        min-width: 0;
        white-space: pre-wrap;
        word-break: break-all;
        background: none;
        padding: 0;
      }
      .cmd .cp {
        flex: none;
      }
      .expect {
        background: #10151f;
        color: #cfe9d6;
        border-radius: 6px;
        padding: 9px 12px;
        margin: 4px 0;
        border-left: 3px solid var(--ok);
        white-space: pre-wrap;
      }
      .wrongbox {
        background: var(--badbg);
        color: var(--bad);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
        margin-top: 4px;
      }
      .pbhint {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: var(--mut);
      }
      textarea.pb {
        width: 100%;
        font:
          13px ui-monospace,
          Menlo,
          monospace;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        margin-top: 4px;
      }
      /* run stage */
      .runc {
        margin: 10px 0;
      }
      .oc {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .oc .ob {
        font: inherit;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 99px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .oc .ob[aria-pressed="true"].passed {
        background: var(--okbg);
        border-color: var(--ok);
        color: var(--ok);
      }
      .oc .ob[aria-pressed="true"].failed {
        background: var(--badbg);
        border-color: var(--bad);
        color: var(--bad);
      }
      .oc .ob[aria-pressed="true"].skipped {
        background: var(--planbg);
        border-color: var(--plan);
        color: var(--plan);
      }
      .oc .ob:focus-visible,
      .runc input:focus-visible,
      .runc textarea:focus-visible,
      .rbar .sub:focus-visible {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      .runc input[type="text"],
      .runc textarea {
        width: 100%;
        font: inherit;
        font-size: 14px;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        margin-top: 4px;
      }
      .runc .lb2 {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        color: var(--mut);
      }
      .serr {
        color: var(--bad);
        font-weight: 600;
        margin-top: 6px;
      }
      .stale {
        background: var(--planbg);
        color: var(--plan);
        border-radius: 6px;
        padding: 6px 10px;
        margin: 8px 0;
        font-size: 14px;
      }
      pre.outp {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--code);
        border-radius: 6px;
        padding: 8px;
        margin: 4px 0 0;
        font:
          13px ui-monospace,
          Menlo,
          monospace;
      }
      .rbar {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        gap: 8px 16px;
        align-items: center;
        flex-wrap: wrap;
        background: var(--card);
        border: 2px solid var(--acc);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 12px 0;
      }
      .rbar .prog {
        font-weight: 700;
      }
      .rbar .saved,
      .rbar .status {
        color: var(--mut);
        font-size: 14px;
      }
      .rbar .status.err {
        color: var(--bad);
        font-weight: 600;
      }
      .rbar .sub {
        margin-left: auto;
        font: inherit;
        font-weight: 700;
        padding: 8px 22px;
        border-radius: 8px;
        border: 0;
        background: var(--acc);
        color: var(--bg);
        cursor: pointer;
      }
      .rbar .sub:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .banner {
        background: var(--planbg);
        color: var(--ink);
        border-left: 6px solid var(--plan);
        border-radius: 6px;
        padding: 8px 14px;
        margin: 8px 0;
      }
      .banner.ok {
        background: var(--okbg);
        border-color: var(--ok);
      }
      .banner p {
        margin: 0;
      }
      .rbox {
        background: var(--card);
        border: 2px solid var(--acc);
        border-radius: 8px;
        padding: 12px 16px;
        margin: 14px 0;
      }
      .rbox h2 {
        margin-top: 0;
      }
      .rbox .big {
        font-size: 17px;
        font-weight: 700;
      }
      .rbox ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      .rbox li {
        margin: 3px 0;
      }
      @media (max-width: 900px) {
        .step .tags,
        .bd {
          padding-left: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">
      <noscript
        >This page draws itself from its embedded data and needs
        JavaScript.</noscript
      >
    </div>
    <script type="application/json" id="vp-data">
      __VP_DATA__
    </script>
    <script>
      __VP_JS__;
    </script>
    <script>
      // CORE:BEGIN
      var VM = (function () {
        var esc = VP.esc,
          list = VP.list,
          byId = VP.byId;

        // Worst first. The automated lanes use the first list, the walkthrough lane the second.
        var STATUS_ORDER = ["gap", "proposed", "planned", "built"];
        var RUN_ORDER = ["failed", "not-run", "skipped", "passed"];
        var STATUS_LABEL = {
          built: "Built",
          planned: "Planned",
          proposed: "Proposed",
        };
        var RUN_LABEL = {
          passed: "Passed",
          failed: "Failed",
          skipped: "Skipped",
          "not-run": "Not run",
        };
        var ACCESS = {
          local: ["LOCAL ONLY", "LOCAL"],
          "cloud-read": ["TOUCHES CLOUD (read)", "CLOUD"],
          "cloud-write": ["CHANGES CLOUD", "CHANGES"],
          prod: ["COULD AFFECT PROD", "PROD"],
          permission: ["NEEDS PERMISSION", "PERM"],
        };

        function pickWorst(order, items) {
          var best = null;
          list(items).forEach(function (s) {
            var r = order.indexOf(s);
            if (r < 0) r = 0;
            if (best === null || r < best) best = r;
          });
          return best === null ? null : order[best];
        }
        function worst(statuses) {
          return pickWorst(STATUS_ORDER, statuses) || "gap";
        }
        function worstRun(outcomes) {
          return pickWorst(RUN_ORDER, outcomes) || "not-run";
        }
        function steps(d) {
          return list(d.walkthrough && d.walkthrough.steps);
        }
        function runPresent(d) {
          return !!d.run && typeof d.run === "object";
        }
        // A run recorded against another walkthrough revision is never counted.
        function hasRun(d) {
          return (
            runPresent(d) &&
            String(d.run.revision) === String((d.walkthrough || {}).revision)
          );
        }
        // A step with no recorded outcome counts as not run.
        function outcome(d, s) {
          var e = hasRun(d) && d.run.steps ? d.run.steps[s.id] : null;
          return e && e.outcome ? e.outcome : "not-run";
        }

        // One grid cell: the tests (or steps) in a lane for a requirement, and the worst status among them.
        function cell(d, rid, lane) {
          var tests = [],
            ss = [];
          if (lane === "walkthrough") {
            steps(d).forEach(function (s, i) {
              if (list(s.requirements).indexOf(rid) >= 0) ss.push(i);
            });
            if (!ss.length) return { status: "gap", tests: [], steps: [] };
            var status = hasRun(d)
              ? worstRun(
                  ss.map(function (i) {
                    return outcome(d, steps(d)[i]);
                  }),
                )
              : "you";
            return { status: status, tests: [], steps: ss };
          }
          list(d.tests).forEach(function (t, i) {
            if (t.lane === lane && list(t.requirements).indexOf(rid) >= 0)
              tests.push(i);
          });
          return {
            status: worst(
              tests.map(function (i) {
                return d.tests[i].status;
              }),
            ),
            tests: tests,
            steps: [],
          };
        }

        // Per lane: requirements with something in the lane (gaps left out), of all, and how many are not built yet.
        function laneTotals(d) {
          var reqs = list(d.requirements);
          return VP.lanes(d).map(function (l) {
            var covered = 0,
              notBuilt = 0;
            reqs.forEach(function (r) {
              var c = cell(d, r.id, l.id);
              if (c.status === "gap") return;
              covered++;
              if (c.status === "proposed" || c.status === "planned") notBuilt++;
            });
            return {
              id: l.id,
              covered: covered,
              of: reqs.length,
              notBuilt: notBuilt,
            };
          });
        }

        // How a requirement is proven today: a built automated test, only the walkthrough, or nothing.
        function proof(d, rid) {
          var built = list(d.tests).some(function (t) {
            return (
              t.status === "built" && list(t.requirements).indexOf(rid) >= 0
            );
          });
          if (built) return "built";
          if (
            steps(d).some(function (s) {
              return list(s.requirements).indexOf(rid) >= 0;
            })
          )
            return "you";
          return waitingOn(d, rid).length ? "waiting" : "none";
        }
        // Open decisions that name a requirement: its missing proof waits on them.
        function waitingOn(d, rid) {
          return list(d.decisions)
            .filter(function (x) {
              return x.status === "open" && list(x.requirements).indexOf(rid) >= 0;
            })
            .map(function (x) {
              return x.id;
            });
        }
        var tentative = VP.tentative;
        function bandCounts(d) {
          var out = {
            total: list(d.requirements).length,
            builtIds: [],
            youIds: [],
            noneIds: [],
            waitIds: [],
            acceptedIds: [],
          };
          list(d.requirements).forEach(function (r) {
            var p = proof(d, r.id);
            if (p === "built") out.builtIds.push(r.id);
            else if (p === "you") out.youIds.push(r.id);
            else if (r.accepted_gap) out.acceptedIds.push(r.id);
            else if (p === "waiting") out.waitIds.push(r.id);
            else out.noneIds.push(r.id);
          });
          out.builtReqs = out.builtIds.length;
          out.youReqs = out.youIds.length;
          out.noneReqs = out.noneIds.length;
          out.waitReqs = out.waitIds.length;
          out.planned = list(d.tests).filter(function (t) {
            return t.status === "planned";
          }).length;
          out.proposed = list(d.tests).filter(function (t) {
            return t.status === "proposed";
          }).length;
          out.pending = out.planned + out.proposed;
          return out;
        }
        function band(d) {
          var b = bandCounts(d);
          var rest =
            (b.noneIds.length
              ? "<span>No proof at all: " +
                VP.reqLinks(d, b.noneIds) +
                "</span> "
              : "") +
            (b.waitIds.length
              ? "<span>Waiting on a decision: " +
                VP.reqLinks(d, b.waitIds) +
                "</span> "
              : "") +
            (b.acceptedIds.length
              ? "<span>Accepted gap: " +
                VP.reqLinks(d, b.acceptedIds) +
                "</span>"
              : "");
          return (
            '<div class="band">' +
            '<div><span class="n g">' +
            b.builtReqs +
            " of " +
            b.total +
            "</span><span>requirements have a built automated test</span>" +
            '<span class="sm">' +
            VP.reqLinks(d, b.builtIds) +
            "</span></div>" +
            '<div><span class="n y">' +
            b.youReqs +
            " of " +
            b.total +
            "</span><span>requirements rest only on your walkthrough</span>" +
            '<span class="sm">' +
            VP.reqLinks(d, b.youIds) +
            "</span>" +
            (rest ? '<span class="sm">' + rest + "</span>" : "") +
            "</div>" +
            '<div><span class="n p">' +
            b.pending +
            "</span><span>automated test" +
            (b.pending === 1 ? "" : "s") +
            " not built yet</span>" +
            '<span class="sm">' +
            b.planned +
            " planned, " +
            b.proposed +
            " proposed</span></div></div>"
          );
        }

        function density(d) {
          return list(d.requirements).length > 6 ? "over" : "detail";
        }

        function tile(d, t, i) {
          return (
            '<button type="button" class="tl mt ' +
            esc(t.status) +
            (tentative(d, t) ? " wait" : "") +
            '" data-t="' +
            i +
            '">' +
            esc(t.name) +
            '<span class="vh">' +
            esc(STATUS_LABEL[t.status] || t.status) +
            (tentative(d, t) ? ", waiting on a decision" : "") +
            "</span></button>"
          );
        }
        function stepTile(d, s) {
          var run = hasRun(d),
            o = outcome(d, s);
          return (
            '<button type="button" class="tl mt wk ' +
            (run ? o : "you") +
            '" data-step="' +
            esc(s.id) +
            '">' +
            esc(s.id) +
            " &middot; " +
            esc(s.title) +
            '<span class="vh">' +
            esc(run ? RUN_LABEL[o] || o : "you run it") +
            "</span></button>"
          );
        }
        // What an empty cell says: an accepted gap, a wait on open decisions, or a plain gap.
        function emptyKind(d, r, lane) {
          if (r.accepted_gap) return { cls: "acc", text: "Accepted gap" };
          var w = waitingOn(d, r.id);
          if (w.length) return { cls: "wait", text: "Waits on " + w.join(", ") };
          return { cls: "", text: lane === "walkthrough" ? "No step" : "GAP" };
        }
        function gapCell(d, r, lane) {
          var k = emptyKind(d, r, lane);
          return (
            '<td class="gap' +
            (k.cls ? " " + k.cls : "") +
            '"><button type="button" class="gb" data-gap="' +
            esc(r.id + ":" + lane) +
            '">' +
            esc(k.text) +
            "</button></td>"
          );
        }
        function detailRow(d, r, ri) {
          var tds = VP.lanes(d)
            .map(function (l) {
              var c = cell(d, r.id, l.id);
              if (c.status === "gap")
                return gapCell(d, r, l.id);
              if (l.id === "walkthrough")
                return (
                  "<td>" +
                  c.steps
                    .map(function (i) {
                      return stepTile(d, steps(d)[i]);
                    })
                    .join("") +
                  "</td>"
                );
              return (
                "<td>" +
                c.tests
                  .map(function (i) {
                    return tile(d, d.tests[i], i);
                  })
                  .join("") +
                "</td>"
              );
            })
            .join("");
          return (
            '<tr class="dr" data-r="' +
            ri +
            '"><td class="rq">' +
            VP.reqLink(d, r.id) +
            rowChips(d, r) +
            "</td>" +
            tds +
            "</tr>"
          );
        }
        function rowChips(d, r) {
          var p = proof(d, r.id);
          var w = r.accepted_gap ? [] : waitingOn(d, r.id);
          return (
            (p === "you" ? '<span class="chip">rests on you</span>' : "") +
            (w.length
              ? '<span class="chip acc">waits on ' + esc(w.join(", ")) + "</span>"
              : "") +
            (r.accepted_gap ? '<span class="chip acc">accepted gap</span>' : "")
          );
        }
        function dotCell(status, names, title, extra) {
          var more =
            names.length > 1
              ? '<b class="oc">+' + (names.length - 1) + "</b>"
              : "";
          return (
            '<td class="o-' +
            status +
            '" title="' +
            esc(title) +
            '"><span class="ol"><i class="dot ' +
            status +
            '"></i><span class="on">' +
            esc(names[0]) +
            "</span>" +
            more +
            "</span></td>"
          );
        }
        function overviewRow(d, r, ri) {
          var tds = VP.lanes(d)
            .map(function (l) {
              var c = cell(d, r.id, l.id);
              if (c.status === "gap") {
                var k = emptyKind(d, r, l.id);
                return (
                  '<td class="o-gap' +
                  (k.cls ? " o-" + k.cls : "") +
                  '" title="' +
                  esc(
                    k.cls === "acc"
                      ? "Accepted gap: " + r.accepted_gap
                      : k.cls === "wait"
                        ? k.text
                        : "Gap: nothing in this lane",
                  ) +
                  '"><span class="ol"><i class="dot gap"></i><span class="on">' +
                  esc(k.text) +
                  "</span></span></td>"
                );
              }
              if (l.id === "walkthrough") {
                var ss = c.steps.map(function (i) {
                  return steps(d)[i];
                });
                return dotCell(
                  c.status,
                  ss.map(function (s) {
                    return s.title;
                  }),
                  ss
                    .map(function (s) {
                      return (
                        s.title +
                        " (" +
                        (hasRun(d) ? RUN_LABEL[outcome(d, s)] : "you run it") +
                        ")"
                      );
                    })
                    .join("; "),
                );
              }
              var ts = c.tests.map(function (i) {
                return d.tests[i];
              });
              return dotCell(
                c.status,
                ts.map(function (t) {
                  return t.name;
                }),
                ts
                  .map(function (t) {
                    return t.name + " (" + t.status + ")";
                  })
                  .join("; "),
              );
            })
            .join("");
          return (
            '<tr class="ov" data-r="' +
            ri +
            '"><td class="rq"><button type="button" class="ovb" aria-label="Show ' +
            esc(r.id) +
            ' in detail"><b>' +
            esc(r.id) +
            "</b> &middot; " +
            esc(r.label) +
            "</button>" +
            rowChips(d, r) +
            "</td>" +
            tds +
            "</tr>"
          );
        }
        function grid(d) {
          var ls = VP.lanes(d);
          var head =
            '<tr><th class="rq">Requirement</th>' +
            ls
              .map(function (l) {
                return (
                  "<th>" +
                  esc(l.label) +
                  "<small>" +
                  esc(l.explain) +
                  "</small></th>"
                );
              })
              .join("") +
            "</tr>";
          var body = list(d.requirements)
            .map(function (r, i) {
              return detailRow(d, r, i) + overviewRow(d, r, i);
            })
            .join("");
          var totals = laneTotals(d)
            .map(function (l) {
              return (
                '<td title="' +
                l.notBuilt +
                ' not built yet">' +
                l.covered +
                " of " +
                l.of +
                " covered</td>"
              );
            })
            .join("");
          return (
            '<table class="grid' +
            (density(d) === "over" ? " ovm" : "") +
            '" id="grid"><thead>' +
            head +
            "</thead><tbody>" +
            body +
            '</tbody><tfoot><tr><td class="rq">Coverage</td>' +
            totals +
            "</tr></tfoot></table>"
          );
        }

        // Parts that no automated test runs for real.
        function unreachedParts(d) {
          return list(d.parts)
            .map(function (p) {
              return p.id;
            })
            .filter(function (id) {
              return !list(d.tests).some(function (t) {
                return list(t.real_parts).indexOf(id) >= 0;
              });
            });
        }
        function system(d) {
          var parts = list(d.parts),
            un = unreachedParts(d);
          if (!parts.length) return "";
          var head =
            '<div class="sh"></div>' +
            parts
              .map(function (p) {
                var u = un.indexOf(p.id) >= 0;
                return (
                  '<div class="sp' +
                  (u ? " unreached" : "") +
                  '"><b>' +
                  esc(p.label) +
                  "</b><small>" +
                  esc(p.what || "") +
                  "</small>" +
                  (u ? "<em>No automated test runs this for real</em>" : "") +
                  "</div>"
                );
              })
              .join("");
          var rows = list(d.tests)
            .map(function (t, i) {
              return (
                '<button type="button" class="stn" data-t="' +
                i +
                '" data-row="' +
                i +
                '">' +
                esc(t.name) +
                "<i>" +
                esc(VP.laneLabel(d, t.lane)) +
                " &middot; " +
                esc(STATUS_LABEL[t.status] || t.status) +
                "</i></button>" +
                parts
                  .map(function (p) {
                    var real = list(t.real_parts).indexOf(p.id) >= 0,
                      fake = list(t.faked_parts).indexOf(p.id) >= 0;
                    return (
                      '<div class="sc ' +
                      (real ? "real" : fake ? "fake" : "skip") +
                      '" data-row="' +
                      i +
                      '" title="' +
                      esc(p.label) +
                      ": " +
                      (real ? "real" : fake ? "faked" : "not used") +
                      '">' +
                      (real ? "real" : fake ? "faked" : "") +
                      "</div>"
                    );
                  })
                  .join("")
              );
            })
            .join("");
          var you =
            '<div class="stn you">You, running the walkthrough<i>The only row that goes the whole way</i></div>' +
            parts
              .map(function () {
                return '<div class="sc you">you</div>';
              })
              .join("");
          return (
            '<div class="sysv"><p class="prime">Each row is one automated test; each column is a part of the system. Click a row for its detail.</p>' +
            '<div class="key"><span><i style="background:var(--okbg);border:1.6px solid var(--ok)"></i>Solid: the test runs that part for real.</span>' +
            '<span><i style="background:repeating-linear-gradient(45deg,var(--mut) 0 1px,transparent 1px 6px);border:1.4px dashed var(--mut)"></i>Hatched: that part is faked.</span>' +
            '<span><i style="border:1.2px dotted var(--line)"></i>Blank: not used by the test.</span>' +
            '<span><i style="background:var(--badbg);border:1px solid var(--bad)"></i>Red part: no automated test runs it for real.</span></div>' +
            '<div class="sysg" style="--n:' +
            parts.length +
            '">' +
            head +
            rows +
            you +
            "</div>" +
            '<div class="sunr' +
            (un.length ? " bad" : "") +
            '">' +
            (un.length
              ? "Run for real by no automated test: " + partLabels(d, un) + "."
              : "Every part is run for real by at least one automated test.") +
            "</div></div>"
          );
        }
        var partLabels = VP.partLabels;

        function panel(titleHtml, bodyHtml) {
          return (
            '<div class="bh"><h3>' +
            titleHtml +
            '</h3><button type="button" class="x" data-close aria-label="Close detail">&times;</button></div><div class="secs">' +
            bodyHtml +
            "</div>"
          );
        }
        function testDetail(d, i) {
          var t = d.tests[i],
            hasParts = list(d.parts).length > 0;
          return panel(
            esc(t.name) +
              ' <span class="badge ' +
              (t.status === "built" ? "ok" : "plan") +
              '">' +
              esc(STATUS_LABEL[t.status] || t.status) +
              "</span>",
            "<div>" +
              '<div class="sec"><span class="k">Lane</span>' +
              VP.laneLabel(d, t.lane) +
              (t.test_name ? " <code>" + esc(t.test_name) + "</code>" : "") +
              "</div>" +
              '<div class="sec"><span class="k">Requirements proven</span>' +
              (VP.reqLinks(d, t.requirements) || "nothing yet") +
              "</div></div><div>" +
              (hasParts
                ? '<div class="sec"><span class="k">Real</span>' +
                  (VP.partLabels(d, t.real_parts) || "nothing named") +
                  '</div><div class="sec"><span class="k">Faked</span>' +
                  (VP.partLabels(d, t.faked_parts) || "nothing named") +
                  "</div>"
                : "") +
              '<div class="sec"><span class="k p">' +
              (t.status === "built"
                ? "Passing tells you"
                : "Passing would tell you") +
              "</span>" +
              esc(t.passing_tells) +
              "</div></div>",
          );
        }
        function gapDetail(d, key) {
          var bits = String(key).split(":"),
            r = byId(d.requirements, bits[0]),
            lane = bits[1];
          if (!r) return "";
          var ss = steps(d)
            .filter(function (s) {
              return list(s.requirements).indexOf(r.id) >= 0;
            })
            .map(function (s) {
              return esc(s.title);
            });
          return panel(
            r.accepted_gap
              ? "An accepted gap"
              : "A gap: nothing in this lane proves it",
            "<div>" +
              '<div class="sec"><span class="k">Requirement</span>' +
              VP.reqLink(d, r.id) +
              "</div>" +
              '<div class="sec"><span class="k">Lane</span>' +
              VP.laneLabel(d, lane) +
              "</div></div><div>" +
              (r.accepted_gap
                ? '<div class="sec"><span class="k">Why it is accepted</span>' +
                  esc(r.accepted_gap) +
                  "</div>"
                : "") +
              (waitingOn(d, r.id).length
                ? '<div class="sec"><span class="k">Waiting on</span>' +
                  esc(waitingOn(d, r.id).join(", ")) +
                  " (an open decision)</div>"
                : "") +
              '<div class="sec"><span class="k">What covers it instead</span>' +
              (ss.length
                ? "Walkthrough: " + ss.join("; ") + "."
                : "No walkthrough step either.") +
              "</div></div>",
          );
        }

        function testsList(d) {
          var tests = list(d.tests),
            hasParts = list(d.parts).length > 0;
          var nb = tests.filter(function (t) {
            return t.status === "built";
          }).length;
          var body = tests
            .map(function (t, i) {
              return VP.testRow(d, t, i, {
                badgeClass: t.status === "built" ? "ok" : "plan",
                badgeText: esc(STATUS_LABEL[t.status] || t.status),
                reasonHtml: "",
                passingLabel:
                  t.status === "built"
                    ? "Passing tells you"
                    : "Passing would tell you",
              });
            })
            .join("");
          return (
            '<div class="alt" id="alt"><button type="button" class="alth" id="alth" aria-expanded="false" aria-controls="altb">' +
            '<span class="chv" aria-hidden="true">&#9656;</span>All tests <span style="font-weight:400;color:var(--mut)">&mdash; ' +
            tests.length +
            " in all: " +
            nb +
            " built, " +
            (tests.length - nb) +
            " not built yet</span></button>" +
            '<div class="altb" id="altb">' +
            (body || '<p class="empty">No tests yet.</p>') +
            "</div></div>"
          );
        }

        // Cloud and prod summary for the top of the walkthrough.
        function accessSummary(d) {
          var ss = steps(d),
            n = ss.length;
          var has = function (s, a) {
            return list(s.access).indexOf(a) >= 0;
          };
          var cloud = ss.filter(function (s) {
            return (
              has(s, "cloud-read") || has(s, "cloud-write") || has(s, "prod")
            );
          }).length;
          var write = ss.filter(function (s) {
            return has(s, "cloud-write");
          }).length;
          var prod = ss.filter(function (s) {
            return has(s, "prod");
          }).length;
          var perm = ss.filter(function (s) {
            return has(s, "permission");
          }).length;
          var text;
          if (!n) text = "No walkthrough steps yet.";
          else if (!cloud && !perm)
            text =
              "All " +
              n +
              " step" +

        function accessBadges(s) {

        // ---- run stage -------------------------------------------------

          if (err) {
            err.hidden = !st.failed[id];
            err.textContent = st.failed[id]
              ? "Not saved: " + st.failed[id] + ". Kept here; retrying."
              : "";
          }
        }
        function docOf(id) {
          var s = cur(id);
          return {
            outcome: s.outcome,
            skip_reason: s.skip_reason,
            output: s.output,
            note: s.note,
            rev: rev,
            updatedAt: st.stamp[id],
          };
        }
        var inflightN = 0;
        // Every save is tracked until it settles, so Submit can wait for a write already on its way.
        function write(id) {
          var key = id + "#" + ++inflightN,
            p = save(id);
          st.inflight[key] = p;
          p.then(function () {
            delete st.inflight[key];
          });
          return p;
        }
        async function save(id) {
          clearTimeout(st.timers[id]);
          delete st.timers[id];
          clearTimeout(st.retry[id]);
          delete st.retry[id];
          if (!st.db) return;
          $("saved").textContent = "Saving...";
          try {
            await st.db.doc("steps/" + id).set(docOf(id));
            var was = st.failed[id];
            delete st.failed[id];
            $("saved").textContent = "Saved.";
            if (was) {
              paint(id, false);
              if (!failedCount()) {
                $("status").className = "status";
                $("status").textContent = "";
              }
            }
          } catch (e) {
            st.failed[id] = (e && (e.message || e.code)) || "the store refused the write";
            $("saved").textContent = "A step is not saved. Retrying.";
            paint(id, false);
            st.retry[id] = setTimeout(function () {
              if (st.failed[id]) write(id);
            }, 5000);
          }
          chrome();
        }
        function change(id, patch, now) {
          Object.assign(cur(id), patch);
          st.stamp[id] = new Date().toISOString();
          paint(id, false);
          chrome();
          clearTimeout(st.timers[id]);
          if (now) write(id);
          else st.timers[id] = setTimeout(function () { write(id); }, 600);
        }
        // Waits until no text save is queued and no write is in flight (a retry timer is not waited on).
        async function flushPending() {
          for (;;) {
            var queued = Object.keys(st.timers),
              running = Object.keys(st.inflight).map(function (k) {
                return st.inflight[k];
              });
            if (!queued.length && !running.length) return;
            await Promise.all(queued.map(write).concat(running));
          }
        }
        // Controls stay off until start() has found out whether the page has a store.
        function setControls(on) {
          document
            .querySelectorAll("button[data-out], [data-skip], [data-paste], [data-note]")
            .forEach(function (el) {
              el.disabled = !on;
            });
        }
        setControls(false);

        document.addEventListener("click", function (e) {
          var b = e.target.closest && e.target.closest("button[data-out]");
          if (!b || !st.ready) return;
          var id = b.getAttribute("data-step"),
            v = b.getAttribute("data-out");
          change(id, { outcome: cur(id).outcome === v ? "" : v }, true);
        });
        document.addEventListener("input", function (e) {
          var el = e.target,
            id;
          if (!st.ready) return;
          if ((id = el.getAttribute && el.getAttribute("data-skip"))) change(id, { skip_reason: el.value }, false);
          else if ((id = el.getAttribute && el.getAttribute("data-paste"))) change(id, { output: el.value }, false);
          else if ((id = el.getAttribute && el.getAttribute("data-note"))) change(id, { note: el.value }, false);
        });

        var reasonText = function (code) {
          return (
            {
              "": "",
              claude_unavailable: "no Claude session is watching this page, or the click was too old",
              consent_required: "the comment prompt was not allowed",
              forbidden: "commenting from the page is off for you here",
              rate_limited: "too many comments, slow down",
              comments_unavailable: "this view cannot send comments",
            }[code] || code
          );
        };
        function showSubmitted(sendError) {
          var s = st.submitted;
          if (!s) return;
          var t = new Date(s.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          var b = $("sentbanner");
          b.hidden = false;
          var p = document.createElement("p");
          p.textContent = s.sent
            ? "Submitted at " + t + " and sent to Claude. The run is waiting to be recorded. Your results stay editable; Submit again to resend."
            : "Submitted at " + t + ", but Claude was not woken (" + (reasonText(sendError || s.send_error) || "not sent") + '). Type "done" in the session. The run is waiting to be recorded.';
          b.replaceChildren(p);
          var s2 = $("status");
          s2.className = "status";
          s2.textContent = "";
          submitBtn.textContent = "Submit again";
        }
        async function submit() {
          if (st.submitting || failedCount()) return;
          st.submitting = true;
          try {
            await submitOnce();
          } finally {
            st.submitting = false;
            chrome();
          }
        }
        async function submitOnce() {
          submitBtn.disabled = true;
          if (failedCount()) {
            var f = $("status");
            f.className = "status err";
            f.textContent = "Some steps are not saved yet. Submit waits until they are.";
            return;
          }
          var c = counts(),
            again = !!(st.submitted && String(st.submitted.rev) === rev);
          // 1. The comment goes first, while this click is still Jet's gesture; no await before it.
          var threadId = (again && st.submitted.threadId) || st.lastThreadId || "",
            sent = false,
            sendError = "";
          var pending = flushPending();
          if (st.comments && st.sendState === "available") {
            var text = VM.submitText(data, c, again);
            try {
              var res;
              if (threadId) {
                try {
                  res = await st.comments.sendToClaude({ threadId: threadId, text: text });
                } catch (e) {
                  if (e && e.code === "not_found") threadId = st.lastThreadId = "";
                  else throw e;
                }
              }
              if (!threadId)
                res = await st.comments.sendToClaude({ anchor: await st.comments.anchorFor(submitBtn), text: text });
              threadId = (res && res.threadId) || threadId;
              if (threadId) st.lastThreadId = threadId;
              sent = true;
            } catch (e) {
              sendError = (e && (e.code || e.message)) || "unknown";
            }
          } else sendError = st.comments ? "send_" + (st.sendState || "unavailable") : "comments_unavailable";
          // 2. Then the durable record, with the same rev.
          try {
            await pending;
            await flushPending();
            if (failedCount()) throw new Error("some steps are not saved");
            c = counts();
            var doc = {
              at: new Date().toISOString(),
              rev: rev,
              counts: { passed: c.passed, failed: c.failed, skipped: c.skipped, not_run: c.not_run },
              threadId: threadId,
              sent: sent,
              send_error: sendError,
            };
            await st.db.doc("meta/submitted").set(doc);
            st.submitted = doc;
          } catch (e) {
            var s = $("status");
            s.className = "status err";
            s.textContent =
              (sent ? "Sent to Claude, but the submit record was not saved: " : "Submit was not saved: ") +
              ((e && e.message) || "the store refused the write") +
              ". Try Submit again.";
            return;
          }
          showSubmitted(sendError);
        }

        var use = function (name) {
          return Promise.resolve(window.claude && window.claude.use ? window.claude.use(name) : null).catch(function () { return null; });
        };
        function banner(text) {
          var n = $("notice");
          n.hidden = false;
          var p = document.createElement("p");
          p.textContent = text;
          n.replaceChildren(p);
        }
        function markStale(id) {
          var box = q("#st-" + id + " .runc");
          if (st.stale[id] || !box) return;
          st.stale[id] = true;
          box.insertAdjacentHTML("afterbegin", VM.staleNote());
        }
        // Stored documents of this revision fill in the steps; any other revision is marked stale.
        function applyStored(snap) {
          snap.docs.forEach(function (d) {
            if (!d.exists) return;
            var v = d.data(),
              id = d.id;
            if (!$("st-" + id)) return;
            if (String(v.rev) !== rev) {
              markStale(id);
              return;
            }
            if ((v.updatedAt || "") > (st.stamp[id] || "")) {
              st.states[id] = { outcome: v.outcome || "", skip_reason: v.skip_reason || "", output: v.output || "", note: v.note || "" };
              st.stamp[id] = v.updatedAt || "";
              paint(id, true);
            }
          });
          chrome();
        }

        async function start() {
          submitBtn.addEventListener("click", submit);
          st.db = await use("db");
          st.comments = await use("comments");
          if (st.comments) {
            try {
              st.sendState = String(await st.comments.canSendToClaude());
            } catch (e) {
              st.sendState = "unavailable";
            }
          }
          st.ready = true;
          setControls(true);
          if (!st.db) {
            banner("Results will not be saved in this view, and there is no Submit. Open the page in claude.ai, signed in.");
            $("saved").textContent = "Not saving.";
            submitBtn.title = "Results cannot be saved in this view";
            chrome();
            return;
          }
          if (!st.comments || st.sendState !== "available") {
            banner(
              !st.comments
                ? 'Submit cannot wake Claude from this view. After you submit, type "done" in the session.'
                : "Claude cannot be woken from this page right now (" + st.sendState + '). After you submit, type "done" in the session.',
            );
          }
          chrome();
          st.db.collection("steps").onSnapshot(applyStored, function (e) {
            $("saved").textContent = "Live updates stopped: " + ((e && e.message) || "store error") + ". Reload the page.";
          });
          st.db.collection("meta").onSnapshot(function (snap) {
            snap.docs.forEach(function (d) {
              if (!d.exists || d.id !== "submitted") return;
              var v = d.data();
              if (v && String(v.rev) === rev) {
                st.submitted = v;
                showSubmitted("");
              }
            });
          }, function () {});
        }
        start();
      })();
    </script>
  </body>
</html>
